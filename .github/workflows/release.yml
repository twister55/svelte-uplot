# Publishing to npm is manual ONLY, through the Run workflow button.
# No push, tag or release triggers: publishing needs external sign-off, so
# nothing here may publish on its own.
#
# Before the first real run (dry_run = false):
#   1. add an NPM_TOKEN secret under Settings → Secrets and variables → Actions
#      (an automation token with publish rights);
#   2. make sure permission to publish has been given.
#
# Every release starts with a version bump in package.json and an entry in
# CHANGELOG.md: npm versions are immutable, a number cannot be published twice.
# The "Verify version is not published yet" step checks that before the build —
# including on a dry run, where `npm publish --dry-run` never asks the registry.
#
# The Run workflow button only appears once this file is on the main branch.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse without publishing: build the package and print the tarball contents'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # npm needs id-token to generate provenance.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # pnpm's version is pinned — see the comment in ci.yml.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Ahead of the build and the tests, so that a taken version number fails in
      # seconds instead of after several minutes of work.
      - name: Verify version is not published yet
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "Preparing to publish $name@$version"

          set +e
          output=$(npm view "$name@$version" version 2>&1)
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "::error::$name@$version is already published — bump the version in package.json"
            exit 1
          fi
          if ! echo "$output" | grep -q "E404"; then
            echo "::error::Could not check the version against the registry"
            echo "$output"
            exit 1
          fi
          echo "Version $version is free"

      # The same checks ci.yml runs: workflow_dispatch can be launched from any
      # branch, so a green CI on main proves nothing about what is being published.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      # The `client` project in vite.config.ts runs its tests in Chromium.
      - name: Install Chromium for vitest browser mode
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: Build package
        run: pnpm build

      # A dry run never exercises provenance — the attestation is only created on a
      # real upload — so the flag belongs on the publishing step alone.
      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
